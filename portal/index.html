<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <title>Portal de Clientes | HummingX BI</title>
    <style>
      :root {
        --bg-page: #F9FAFB;
        --bg-card: #FFFFFF;
        --border-default: #E5E7EB;
        --text-primary: #111827;
        --dur-base: 0.3s;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
        max-width: 100vw;
        width: 100%;
        box-sizing: border-box;
      }
      @media (max-width: 768px) {
        html, body, #root {
          height: auto !important;
          min-height: 100% !important;
          -webkit-overflow-scrolling: touch;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
